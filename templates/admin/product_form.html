{% extends 'admin/base.html' %}
{% block title %}{{ product.name or 'New item' }}{% endblock %}
{% block content %}
<h1>{{ product.name or 'New item' }}</h1>
<form method="post" class="form">
  <label>Name <input name="name" value="{{ product.name or '' }}" required></label>
  <label>Category <input name="category" value="{{ product.category or '' }}" placeholder="e.g. Noodles"></label>
  <label>Price (THB) <input name="price" type="number" min="0" step="1" value="{{ product.price if product.price is not none else '' }}" required></label>
  <label>Description <textarea name="description" rows="2">{{ product.description or '' }}</textarea></label>
  <label>Image URL <input name="image_url" type="url" value="{{ product.image_url or '' }}" placeholder="https://…"></label>
  <label class="check"><input type="checkbox" name="hidden" {% if product.hidden in (True, 'on') %}checked{% endif %}> Hidden from menu</label>
  <div class="actions">
    <a class="btn ghost" href="{{ url_for('admin.products') }}">Cancel</a>
    <button class="btn primary">Save</button>
  </div>
</form>
{% endblock %}
